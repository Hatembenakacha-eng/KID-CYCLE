<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Favoris — KidCycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Shared.css">
  <style>
    :root{--purple:#9b8ec4;--purple-light:#b8aed8;--purple-dark:#7a6daa;--purple-bg:#ede9f7;--gold:#f5a623;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Nunito',sans-serif;background:#f4f4f6;min-height:100vh;}

    /* NAV */
    .topbar-promo{background:linear-gradient(90deg,#f8f6ff,#ede9f7,#f8f6ff);display:flex;align-items:center;justify-content:space-between;padding:9px 40px;font-size:12px;color:#777;font-weight:600;border-bottom:1px solid #f0eef8;}
    .topbar-promo-left::before{content:'✓ ';color:var(--purple);font-weight:900;}
    .topbar-promo-right{display:flex;gap:18px;}
    .topbar-promo-right a{color:#888;text-decoration:none;}
    .topnav{background:#fff;display:flex;align-items:center;gap:24px;padding:0 60px;height:68px;box-shadow:0 1px 8px rgba(0,0,0,.06);position:sticky;top:0;z-index:200;}
    .logo{height:44px;width:auto;cursor:pointer;transition:transform .3s;}
    .logo:hover{transform:scale(1.05) rotate(-2deg);}
    .nav-links{display:flex;gap:24px;flex:1;}
    .nav-links a{text-decoration:none;color:#555;font-size:13.5px;font-weight:700;transition:color .2s;}
    .nav-links a:hover{color:var(--purple);}
    .nav-right{display:flex;align-items:center;gap:10px;margin-left:auto;}
    .btn-cart{display:flex;align-items:center;gap:7px;border:1.5px solid #e8e4f4;border-radius:24px;padding:7px 14px;font-size:13px;font-weight:700;color:#666;text-decoration:none;transition:all .2s;}
    .btn-cart:hover,.btn-cart.active{border-color:var(--purple);color:var(--purple);background:var(--purple-bg);}
    .nav-badge{background:var(--purple-light);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;}
    .nav-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;transition:background .2s;position:relative;}
    .nav-icon:hover{background:var(--purple-bg);}
    .nav-emoji-icon{width:20px;height:20px;}
    .swaps-badge{background:linear-gradient(135deg,var(--gold),#e89a1a);color:#fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;cursor:pointer;box-shadow:0 2px 8px rgba(245,166,35,.4);}
    .gold-coin{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;background:linear-gradient(135deg,var(--gold),#e89a1a);border-radius:50%;font-size:7px;font-weight:900;color:#fff;flex-shrink:0;}

    /* PAGE */
    .page-wrap{max-width:1100px;margin:0 auto;padding:32px 24px;display:grid;grid-template-columns:260px 1fr;gap:28px;align-items:start;}
    .page-title{font-size:28px;font-weight:900;color:var(--purple);margin-bottom:28px;}

    /* SIDEBAR */
    .sidebar{background:#fff;border-radius:20px;padding:28px 20px;box-shadow:0 2px 14px rgba(0,0,0,.06);position:sticky;top:90px;}
    .sidebar-title{font-size:20px;font-weight:900;color:#222;text-align:center;margin-bottom:22px;}
    .sidebar-menu{list-style:none;}
    .sidebar-menu li a{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;text-decoration:none;font-size:14px;font-weight:700;color:#777;transition:all .2s;margin-bottom:4px;}
    .sidebar-menu li a:hover{background:var(--purple-bg);color:var(--purple);}
    .sidebar-menu li a.active{background:var(--purple);color:#fff;}
    .sidebar-menu li a .ico{font-size:17px;width:20px;text-align:center;}
    .sidebar-swaps{margin-top:24px;padding:14px 16px;background:linear-gradient(135deg,#fdf8ee,#fef3d0);border-radius:14px;border-left:4px solid var(--gold);}
    .sidebar-swaps .sw-label{font-size:11px;font-weight:800;color:#c77a00;text-transform:uppercase;letter-spacing:.5px;}
    .sidebar-swaps .sw-val{font-size:18px;font-weight:900;color:#333;margin-top:4px;display:flex;align-items:center;gap:8px;}

    /* MAIN */
    .main-col{}

    /* FAVS GRID */
    .favs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}

    /* FAV CARD */
    .fav-card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 2px 14px rgba(0,0,0,.06);position:relative;transition:transform .3s,box-shadow .3s;cursor:pointer;}
    .fav-card:hover{transform:translateY(-6px);box-shadow:0 14px 36px rgba(155,142,196,.18);}
    .fav-card:hover .fav-img{transform:scale(1.05) translateY(-4px);}

    /* Heart icon — filled gold */
    .fav-heart-btn{position:absolute;top:14px;right:14px;z-index:3;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;font-size:17px;transition:transform .3s,background .2s;box-shadow:0 2px 8px rgba(0,0,0,.1);}
    .fav-heart-btn:hover{transform:scale(1.2);background:#fff0f0;}

    /* Image */
    .fav-img-wrap{background:#f5f4fb;padding:16px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
    .fav-img{width:100%;height:100%;object-fit:contain;transition:transform .4s ease;display:block;}

    /* Body */
    .fav-body{padding:14px 16px 16px;}
    .fav-name{font-size:14px;font-weight:800;color:#333;margin-bottom:3px;}
    .fav-sub{font-size:11px;color:var(--purple-light);margin-bottom:12px;}
    .fav-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;}
    .fav-price{font-size:15px;font-weight:900;color:#333;display:flex;align-items:center;gap:5px;}

    /* Add to cart btn — changes when in cart */
    .btn-add-fav{flex:1;padding:10px;border-radius:10px;border:none;background:var(--purple-light);color:#fff;font-size:12px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;transition:all .2s;position:relative;overflow:hidden;}
    .btn-add-fav::before{content:'';position:absolute;top:-50%;left:-60%;width:40%;height:200%;background:rgba(255,255,255,.2);transform:skewX(-20deg);transition:left .5s;}
    .btn-add-fav:hover::before{left:120%;}
    .btn-add-fav:hover{background:var(--purple-dark);}
    .btn-add-fav.in-cart{background:#22c55e;}
    .btn-add-fav.in-cart:hover{background:#16a34a;}

    /* Empty state */
    .empty-favs{text-align:center;padding:60px 24px;color:#aaa;grid-column:1/-1;}
    .empty-favs .ico{font-size:64px;margin-bottom:16px;animation:heartbeat 1.5s ease infinite;}
    @keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
    .empty-favs h3{font-size:18px;font-weight:800;color:var(--purple-light);margin-bottom:8px;}
    .empty-favs p{font-size:13px;color:#bbb;margin-bottom:22px;}
    .btn-discover{display:inline-block;padding:13px 28px;border-radius:12px;background:var(--purple);color:#fff;font-size:14px;font-weight:800;text-decoration:none;transition:all .2s;box-shadow:0 4px 14px rgba(155,142,196,.4);}
    .btn-discover:hover{background:var(--purple-dark);transform:translateY(-2px);}

    /* Toast */
    #kc-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1a1a2e;color:#fff;padding:11px 22px;border-radius:10px;font-size:13px;font-weight:700;z-index:9999;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.3);}
    #kc-toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
    #kc-toast.err{background:#e04040;}

    /* Ripple */
    .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);width:10px;height:10px;transform:scale(0);animation:rippleAnim .6s linear;pointer-events:none;}
    @keyframes rippleAnim{to{transform:scale(30);opacity:0}}

    @media(max-width:900px){.favs-grid{grid-template-columns:repeat(2,1fr);}.page-wrap{grid-template-columns:1fr;}.topnav{padding:0 16px;}}
  </style>
</head>
<body>

<div class="topbar-promo">
  <div class="topbar-promo-left">Livraison gratuite pour toutes les commandes de plus de 50 €</div>
  <div class="topbar-promo-right"><a href="#">Faqs</a><a href="#">ⓘ Besoin d'aide?</a></div>
</div>

<header class="topnav">
  <a href="page acceuil.html"><img class="logo" src="images/Kidcycle.png" alt="KidCycle"></a>
  <nav class="nav-links">
    <a href="page acceuil.html">Acheter maintenant</a>
    <a href="Nouveautes.html">Nouveautés</a>
    <a href="Vente.html">Vente</a>
    <a href="produits profile.html">Mes produits</a>
  </nav>
  <div class="nav-right">
    <a href="panier.html" class="btn-cart">
      <img class="nav-emoji-icon" src="images/icon-cart.svg" alt="panier">
      Mon Panier <span class="nav-badge" id="cart-count">0</span>
    </a>
    <a href="Favoris.html" class="nav-icon active" title="Mes favoris" style="position:relative">
      <img class="nav-emoji-icon" src="images/icon-heart-fill.svg" alt="favoris">
      <span id="fav-badge" style="position:absolute;top:-4px;right:-4px;background:#e04040;color:#fff;font-size:9px;font-weight:900;border-radius:50%;width:16px;height:16px;display:none;align-items:center;justify-content:center;">0</span>
    </a>
    <a href="profile.html" class="nav-icon"><img class="nav-emoji-icon" src="images/icon-user.svg" alt="profil"></a>
    <div class="swaps-badge" id="swaps-nav">S</div>
  </div>
</header>

<div class="page-wrap">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-title">Mon compte</div>
    <ul class="sidebar-menu">
      <li><a href="Favoris.html" class="active"><span class="ico">❤️</span> Mes favoris (<span id="fav-count">0</span>)</a></li>
      <li><a href="panier.html"><span class="ico">🛒</span> Mon panier</a></li>
      <li><a href="produits profile.html"><span class="ico">👕</span> Mes produits</a></li>
      <li><a href="Commandes.html"><span class="ico">📦</span> Mes commandes</a></li>
    </ul>
    <div class="sidebar-swaps">
      <div class="sw-label">SWAPS disponible</div>
      <div class="sw-val">
        <span class="gold-coin">S</span>
        <span id="swaps-num">500.00</span>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main-col">
    <div class="page-title">Mes favoris</div>
    <div class="favs-grid" id="favs-grid"></div>
  </div>

</div>

<div id="kc-toast"></div>

<script>
'use strict';
var S={SESSION:'kc_session',FAVS:'kc_favs',CART:'kc_cart'};
function get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function getFavs(){return get(S.FAVS)||[];}
function getCart(){return get(S.CART)||[];}
function getSession(){return get(S.SESSION);}

function toast(msg,isErr){
  var t=document.getElementById('kc-toast');
  t.textContent=msg; t.className='show'+(isErr?' err':'');
  clearTimeout(t._t); t._t=setTimeout(function(){t.className='';},2800);
}

function updateNav(){
  var f=getFavs().length; var c=getCart().length;
  var fb=document.getElementById('fav-badge');
  if(fb){fb.textContent=f;fb.style.display=f>0?'flex':'none';}
  var fc=document.getElementById('fav-count'); if(fc)fc.textContent=f;
  var cc=document.getElementById('cart-count'); if(cc)cc.textContent=c;
  var s=getSession();
  var sn=document.getElementById('swaps-num'); if(sn)sn.textContent=Number(s?s.swaps||50:50).toFixed(2);
}

function isInCart(id){return getCart().some(function(c){return c.id===id;});}

function renderFavs(){
  var favs=getFavs();
  var grid=document.getElementById('favs-grid');

  if(!favs.length){
    grid.innerHTML='<div class="empty-favs">'+
      '<div class="ico">🤍</div>'+
      '<h3>Vos favoris sont vides</h3>'+
      '<p>Cliquez sur ❤ pour sauvegarder vos articles préférés.</p>'+
      '<a href="page acceuil.html" class="btn-discover">Découvrir les articles →</a>'+
    '</div>';
    return;
  }

  grid.innerHTML=favs.map(function(item){
    var inCart=isInCart(item.id);
    return '<div class="fav-card" data-id="'+item.id+'">'+
      '<button class="fav-heart-btn" onclick="removeFav('+item.id+')" title="Retirer des favoris">❤️</button>'+
      '<a href="detail produit.html">'+
        '<div class="fav-img-wrap">'+
          '<img class="fav-img" src="'+item.img+'" alt="'+item.nom+'">'+
        '</div>'+
      '</a>'+
      '<div class="fav-body">'+
        '<div class="fav-name">'+item.nom+'</div>'+
        '<div class="fav-sub">5 types de set disponibles</div>'+
        '<div class="fav-footer">'+
          '<span class="fav-price"><span class="gold-coin">S</span> '+Number(item.prix||0).toFixed(2)+'</span>'+
          '<button class="btn-add-fav'+(inCart?' in-cart':'')+'" data-id="'+item.id+'" onclick="addToCart(this,'+item.id+')">'+(inCart?'Dans mon panier':'Ajouter au panier')+'</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');

  /* Tilt effect */
  grid.querySelectorAll('.fav-card').forEach(function(card){
    card.addEventListener('mousemove',function(e){
      var r=card.getBoundingClientRect();
      var x=(e.clientX-r.left)/r.width-0.5;
      var y=(e.clientY-r.top)/r.height-0.5;
      card.style.transform='translateY(-6px) rotateY('+(x*6)+'deg) rotateX('+(-y*6)+'deg)';
      card.style.transformStyle='preserve-3d';
    });
    card.addEventListener('mouseleave',function(){card.style.transform='';});
  });
}

function removeFav(id){
  var favs=getFavs().filter(function(f){return f.id!==id;});
  set(S.FAVS,favs);
  /* Heart pop animation */
  var card=document.querySelector('.fav-card[data-id="'+id+'"]');
  if(card){
    card.style.transition='all .35s';
    card.style.transform='scale(0.8)';
    card.style.opacity='0';
    setTimeout(function(){renderFavs();updateNav();},350);
  } else {
    renderFavs(); updateNav();
  }
  toast('🤍 Retiré des favoris');
}

function addToCart(btn,id){
  var session=getSession();
  if(!session){
    if(confirm('Pour ajouter au panier, connectez-vous ?'))location.href='Connexion.html';
    return;
  }
  var favs=getFavs();
  var item=favs.find(function(f){return f.id===id;});
  if(!item)return;

  var cart=getCart();
  var existing=cart.find(function(c){return c.id===id;});
  if(existing){existing.qty=(existing.qty||1)+1;}
  else{cart.push({id:item.id,nom:item.nom,img:item.img,prix:item.prix,qty:1});}
  set(S.CART,cart);

  /* Ripple */
  var r=document.createElement('span'); r.className='ripple';
  btn.appendChild(r); setTimeout(function(){r.remove();},600);

  btn.textContent='Dans mon panier';
  btn.classList.add('in-cart');
  toast('🛒 '+item.nom+' ajouté au panier !');
  updateNav();
}

renderFavs();
updateNav();
</script>
</body>
</html>
