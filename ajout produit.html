<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajouter un produit — KidCycle</title>
  <meta http-equiv="refresh" content="0;url=ajouter-produit.html">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Shared.css">
  <style>
    :root{--purple:#9b8ec4;--purple-light:#b8aed8;--purple-dark:#7a6daa;--purple-bg:#ede9f7;--gold:#f5a623;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Nunito',sans-serif;background:#f4f4f6;min-height:100vh;}
    .topnav{background:#fff;display:flex;align-items:center;gap:24px;padding:0 60px;height:68px;box-shadow:0 1px 8px rgba(0,0,0,.06);position:sticky;top:0;z-index:200;}
    .logo{height:44px;width:auto;cursor:pointer;transition:transform .3s;}
    .logo:hover{transform:scale(1.05) rotate(-2deg);}
    .nav-links{display:flex;gap:24px;flex:1;}
    .nav-links a{text-decoration:none;color:#555;font-size:13.5px;font-weight:700;transition:color .2s;}
    .nav-right{display:flex;align-items:center;gap:10px;margin-left:auto;}
    .btn-cart{display:flex;align-items:center;gap:7px;border:1.5px solid #e8e4f4;border-radius:24px;padding:7px 14px;font-size:13px;font-weight:700;color:#666;text-decoration:none;transition:all .2s;}
    .nav-badge{background:var(--purple-light);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;}
    .nav-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;}
    .nav-emoji-icon{width:20px;height:20px;}
    .swaps-badge{background:linear-gradient(135deg,var(--gold),#e89a1a);color:#fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;}

    /* PAGE */
    .page{max-width:1100px;margin:32px auto;padding:0 24px;display:grid;grid-template-columns:1fr 420px;gap:24px;align-items:start;}

    /* LEFT FORM CARD */
    .form-card{background:#fff;border-radius:20px;padding:32px;box-shadow:0 2px 14px rgba(0,0,0,.06);}
    .form-title{font-size:18px;font-weight:900;color:#333;margin-bottom:24px;padding-bottom:14px;border-bottom:2px solid #f0eef8;}
    .form-group{margin-bottom:18px;}
    .form-label{font-size:13px;font-weight:800;color:#555;margin-bottom:7px;display:flex;align-items:center;gap:4px;}
    .req{color:#e04040;font-size:15px;}
    .form-input,.form-select,.form-textarea{width:100%;padding:13px 16px;background:#f7f5fc;border:2px solid transparent;border-radius:12px;font-size:14px;font-weight:600;font-family:'Nunito',sans-serif;color:#333;outline:none;transition:border-color .25s,background .25s,box-shadow .25s;appearance:none;}
    .form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--purple-light);background:#fff;box-shadow:0 0 0 4px rgba(155,142,196,.1);}
    .form-input::placeholder,.form-textarea::placeholder{color:#ccc;}
    .form-input:disabled{color:#bbb;cursor:not-allowed;background:#f0f0f0;}
    .select-wrap{position:relative;}
    .select-wrap::after{content:'▾';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#aaa;pointer-events:none;font-size:14px;}
    .form-select{cursor:pointer;}
    .form-textarea{resize:vertical;min-height:100px;line-height:1.6;}
    .char-count{font-size:11px;color:#aaa;text-align:right;margin-top:4px;}

    /* Radio group */
    .radio-group{display:flex;gap:14px;flex-wrap:wrap;}
    .radio-opt{display:flex;align-items:center;gap:8px;padding:10px 16px;border:2px solid #f0eef8;border-radius:10px;cursor:pointer;transition:all .2s;font-size:13px;font-weight:700;color:#666;}
    .radio-opt:hover{border-color:var(--purple-light);color:var(--purple);}
    .radio-opt input{accent-color:var(--purple);width:16px;height:16px;}
    .radio-opt.selected{border-color:var(--purple-light);background:var(--purple-bg);color:var(--purple);}

    /* RIGHT PHOTOS */
    .photos-card{background:#fff;border-radius:20px;padding:28px;box-shadow:0 2px 14px rgba(0,0,0,.06);}
    .photos-title{font-size:16px;font-weight:900;color:#333;margin-bottom:16px;display:flex;align-items:center;gap:6px;}
    .photos-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;}
    .photo-slot{aspect-ratio:1;border-radius:12px;border:2px dashed #e0dcf4;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:border-color .2s,background .2s;position:relative;overflow:hidden;background:#fafafa;}
    .photo-slot:hover{border-color:var(--purple-light);background:var(--purple-bg);}
    .photo-slot.filled{border-style:solid;border-color:var(--purple-light);}
    .photo-slot .upload-ico{font-size:22px;color:#ccc;transition:color .2s;}
    .photo-slot:hover .upload-ico{color:var(--purple-light);}
    .photo-slot .upload-lbl{font-size:9px;font-weight:700;color:#bbb;margin-top:4px;text-align:center;}
    .photo-slot img.preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:10px;}
    .photo-slot .remove-photo{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(224,64,64,.9);color:#fff;border:none;cursor:pointer;font-size:11px;display:none;align-items:center;justify-content:center;}
    .photo-slot.filled:hover .remove-photo{display:flex;}
    .photos-note{font-size:11px;color:#aaa;text-align:center;margin-top:8px;}

    /* Publish button */
    .btn-publish{width:100%;padding:17px;border-radius:14px;background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:#fff;border:none;font-size:16px;font-weight:900;cursor:pointer;font-family:'Nunito',sans-serif;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .2s,box-shadow .2s;box-shadow:0 6px 20px rgba(155,142,196,.4);position:relative;overflow:hidden;}
    .btn-publish::before{content:'';position:absolute;top:-50%;left:-60%;width:40%;height:200%;background:rgba(255,255,255,.15);transform:skewX(-20deg);transition:left .5s;}
    .btn-publish:hover::before{left:120%;}
    .btn-publish:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(155,142,196,.55);}
    .spinner{display:none;width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .btn-publish.loading .pub-text,.btn-publish.loading .pub-arrow{display:none;}
    .btn-publish.loading .spinner{display:block;}

    /* Error */
    .err-msg{background:#fff0f0;border:1.5px solid #fca5a5;border-radius:10px;padding:10px 14px;font-size:13px;color:#e04040;font-weight:700;margin-bottom:14px;display:none;}
    .err-msg.show{display:block;animation:shake .4s;}
    @keyframes shake{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}

    /* Success */
    .success-overlay{position:fixed;inset:0;background:rgba(155,142,196,.96);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;pointer-events:none;transition:opacity .5s;}
    .success-overlay.show{opacity:1;pointer-events:all;}
    .success-icon{font-size:80px;animation:popIn .5s cubic-bezier(.34,1.56,.64,1);}
    @keyframes popIn{from{transform:scale(0)}to{transform:scale(1)}}
    .success-text{color:#fff;font-size:26px;font-weight:900;}
    .success-sub{color:rgba(255,255,255,.8);font-size:14px;}
    .btn-success{padding:14px 32px;border-radius:12px;background:#fff;color:var(--purple);font-size:14px;font-weight:900;border:none;cursor:pointer;font-family:'Nunito',sans-serif;margin-top:8px;}

    #kc-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1a1a2e;color:#fff;padding:11px 22px;border-radius:10px;font-size:13px;font-weight:700;z-index:9999;opacity:0;transition:all .3s;pointer-events:none;}
    #kc-toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

    @media(max-width:900px){.page{grid-template-columns:1fr;}.photos-grid{grid-template-columns:repeat(3,1fr);}.topnav{padding:0 16px;}}
  </style>
</head>
<body>
<script>location.replace('ajouter-produit.html');</script>

<header class="topnav">
  <a href="page acceuil.html"><img class="logo" src="photos/Kidcycle.png" alt="KidCycle"></a>
  <nav class="nav-links">
    <a href="page acceuil.html">Acheter maintenant</a>
    <a href="Nouveautes.html">Nouveautés</a>
    <a href="Vente.html">Vente</a>
    <a href="produits profile.html">Mes produits</a>
  </nav>
  <div class="nav-right">
    <a href="panier.html" class="btn-cart"><img class="nav-emoji-icon" src="photos/icon-cart.svg" alt="panier"> Mon Panier <span class="nav-badge" id="cart-count">0</span></a>
    <a href="Favoris.html" class="nav-icon"><img class="nav-emoji-icon" src="photos/icon-heart.svg" alt="favoris"></a>
    <a href="profile.html" class="nav-icon"><img class="nav-emoji-icon" src="photos/icon-user.svg" alt="profil"></a>
    <div class="swaps-badge">S</div>
  </div>
</header>

<div class="page">

  <!-- FORM -->
  <div class="form-card">
    <div class="form-title">Détails du produit</div>

    <div class="err-msg" id="err-msg"></div>

    <!-- ID (auto) -->
    <div class="form-group">
      <div class="form-label">ID</div>
      <input type="text" class="form-input" id="f-id" disabled>
    </div>

    <!-- Titre -->
    <div class="form-group">
      <div class="form-label">Titre <span class="req">*</span></div>
      <input type="text" class="form-input" id="f-titre" placeholder="Titre">
    </div>

    <!-- État -->
    <div class="form-group">
      <div class="form-label">État <span class="req">*</span></div>
      <div class="radio-group">
        <label class="radio-opt" id="ro-neuf">
          <input type="radio" name="etat" value="neuf" onchange="selectRadio('ro-neuf')"> Neuf avec étiquette
        </label>
        <label class="radio-opt selected" id="ro-tbon">
          <input type="radio" name="etat" value="tres-bon" checked onchange="selectRadio('ro-tbon')"> Très bon état
        </label>
        <label class="radio-opt" id="ro-bon">
          <input type="radio" name="etat" value="bon" onchange="selectRadio('ro-bon')"> Bon état
        </label>
      </div>
    </div>

    <!-- Genre -->
    <div class="form-group">
      <div class="form-label">Genre <span class="req">*</span></div>
      <div class="select-wrap">
        <select class="form-select" id="f-genre">
          <option value="">Choisir le genre</option>
          <option value="fille">Fille</option>
          <option value="garcon">Garçon</option>
          <option value="unisexe">Unisexe</option>
        </select>
      </div>
    </div>

    <!-- Catégorie -->
    <div class="form-group">
      <div class="form-label">Catégorie <span class="req">*</span></div>
      <div class="select-wrap">
        <select class="form-select" id="f-cat">
          <option value="">Catégorie</option>
          <option value="bebe">Bébé (0–2 ans)</option>
          <option value="fille">Fille (2–8 ans)</option>
          <option value="garcon">Garçon (2–8 ans)</option>
          <option value="junior">Junior (8–14 ans)</option>
        </select>
      </div>
    </div>

    <!-- Taille -->
    <div class="form-group">
      <div class="form-label">Taille <span class="req">*</span></div>
      <div class="select-wrap">
        <select class="form-select" id="f-taille">
          <option value="">Taille</option>
          <option value="0-3 mois">0–3 mois</option>
          <option value="3-6 mois">3–6 mois</option>
          <option value="6-12 mois">6–12 mois</option>
          <option value="12-18 mois">12–18 mois</option>
          <option value="18-24 mois">18–24 mois</option>
          <option value="2-3 ans">2–3 ans</option>
          <option value="3-4 ans">3–4 ans</option>
          <option value="4-5 ans">4–5 ans</option>
          <option value="5-6 ans">5–6 ans</option>
          <option value="6-7 ans">6–7 ans</option>
          <option value="8-10 ans">8–10 ans</option>
          <option value="10-12 ans">10–12 ans</option>
          <option value="12-14 ans">12–14 ans</option>
        </select>
      </div>
    </div>

    <!-- Prix -->
    <div class="form-group">
      <div class="form-label">Prix SWAPS <span class="req">*</span></div>
      <input type="number" class="form-input" id="f-prix" placeholder="Ex: 34" min="1" step="0.5">
    </div>

    <!-- Description -->
    <div class="form-group">
      <div class="form-label">Description <span class="req">*</span></div>
      <textarea class="form-textarea" id="f-desc" placeholder="Description" maxlength="200" oninput="updateCharCount(this)"></textarea>
      <div class="char-count"><span id="char-count">0</span>/200</div>
    </div>
  </div>

  <!-- PHOTOS + PUBLISH -->
  <div>
    <div class="photos-card">
      <div class="photos-title">Photos <span class="req">*</span></div>
      <input type="file" id="photo-input" accept="image/*" multiple style="display:none" onchange="handlePhotos(this)">
      <div class="photos-grid" id="photos-grid">
        <!-- 7 slots -->
      </div>
      <div class="photos-note">Formats acceptés : JPG, PNG, WEBP · Max 5 Mo par photo</div>
    </div>

    <button class="btn-publish" id="btn-pub" onclick="publishProduct(this)">
      <div class="spinner"></div>
      <span class="pub-text">Publier</span>
      <span class="pub-arrow">→</span>
    </button>
  </div>

</div>

<!-- SUCCESS -->
<div class="success-overlay" id="success-ov">
  <div class="success-icon">🎉</div>
  <div class="success-text">Produit publié !</div>
  <div class="success-sub">Votre article est en attente de validation</div>
  <button class="btn-success" onclick="location.href='produits profile.html'">Voir mes produits →</button>
</div>

<div id="kc-toast"></div>

<script>
'use strict';
var S={SESSION:'kc_session',CART:'kc_cart',MY_PRODS:'kc_my_products'};
function get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function getSession(){return get(S.SESSION);}

function toast(msg){var t=document.getElementById('kc-toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2600);}

/* Auth check */
(function(){
  var s=getSession();
  if(!s){if(confirm('Connexion requise pour ajouter un produit. Se connecter ?'))location.href='Connexion.html';else location.href='page acceuil.html';}
  document.getElementById('cart-count').textContent=(get(S.CART)||[]).length;
})();

/* Auto-generate ID */
document.getElementById('f-id').value='#P-'+String(Math.floor(Math.random()*90000+10000));

/* Radio selection */
function selectRadio(activeId){
  ['ro-neuf','ro-tbon','ro-bon'].forEach(function(id){
    document.getElementById(id).classList.toggle('selected',id===activeId);
  });
}

/* Char count */
function updateCharCount(ta){document.getElementById('char-count').textContent=ta.value.length;}

/* Photo slots */
var uploadedPhotos=[];
function buildSlots(){
  var g=document.getElementById('photos-grid');
  g.innerHTML='';
  for(var i=0;i<7;i++){
    var slot=document.createElement('div');
    slot.className='photo-slot'+(uploadedPhotos[i]?' filled':'');
    slot.dataset.idx=i;
    if(uploadedPhotos[i]){
      slot.innerHTML='<img class="preview" src="'+uploadedPhotos[i]+'" alt="photo '+i+'">'+
        '<button class="remove-photo" onclick="removePhoto('+i+',event)">✕</button>';
    } else if(i===0){
      slot.innerHTML='<div class="upload-ico">⬆</div><div class="upload-lbl">File Uploader<br>fichiers jpg/png</div>';
      slot.onclick=function(){document.getElementById('photo-input').click();};
    } else {
      slot.innerHTML='<div class="upload-ico" style="font-size:26px;color:#e0dcf4">+</div>';
      slot.onclick=function(){document.getElementById('photo-input').click();};
    }
    g.appendChild(slot);
  }
}
function handlePhotos(input){
  var files=Array.from(input.files);
  files.forEach(function(file){
    if(uploadedPhotos.length>=7)return;
    var fr=new FileReader();
    fr.onload=function(e){uploadedPhotos.push(e.target.result);buildSlots();};
    fr.readAsDataURL(file);
  });
  input.value='';
}
function removePhoto(idx,e){
  e.stopPropagation();
  uploadedPhotos.splice(idx,1);
  buildSlots();
}
buildSlots();

/* Publish */
function publishProduct(btn){
  var titre=document.getElementById('f-titre').value.trim();
  var genre=document.getElementById('f-genre').value;
  var cat=document.getElementById('f-cat').value;
  var taille=document.getElementById('f-taille').value;
  var prix=parseFloat(document.getElementById('f-prix').value);
  var desc=document.getElementById('f-desc').value.trim();
  var etat=document.querySelector('input[name=etat]:checked');
  var errEl=document.getElementById('err-msg');
  errEl.classList.remove('show');

  if(!titre||!genre||!cat||!taille||!prix||!desc||!etat){
    errEl.textContent='❌ Veuillez remplir tous les champs obligatoires.';
    errEl.classList.add('show'); return;
  }
  if(prix<=0){errEl.textContent='❌ Prix invalide.';errEl.classList.add('show');return;}

  btn.classList.add('loading');
  setTimeout(function(){
    var s=getSession();
    var prods=get(S.MY_PRODS)||[];
    var newProd={
      id:Date.now(), titre:titre, genre:genre, categorie:cat,
      taille:taille, prix:prix, description:desc,
      etat:etat.value, statut:'en_attente',
      img:uploadedPhotos[0]||'photos/cl1.png',
      vendeur:s?s.email:'', date:new Date().toISOString()
    };
    prods.push(newProd);
    set(S.MY_PRODS,prods);
    btn.classList.remove('loading');
    document.getElementById('success-ov').classList.add('show');
  },1000);
}
</script>
</body>
</html>
